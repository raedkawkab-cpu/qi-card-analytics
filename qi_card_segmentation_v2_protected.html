<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qi Card Segmentation Report - Protected</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f3cd00;
      --accent-dark: #c9a200;
      --danger: #dc2626;
      --success: #059669;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
      color: var(--text);
    }

    #lockScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      z-index: 9999;
      padding: 20px;
    }

    #lockScreen.hidden {
      display: none;
    }

    .lock-panel {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 28px 24px 22px;
      border: 2px solid rgba(243, 205, 0, 0.45);
    }

    .lock-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .lock-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: linear-gradient(135deg, var(--accent), #fde68a);
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.5);
    }

    h2 {
      margin: 0;
      font-size: 22px;
      color: var(--text);
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 14px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-dark);
      box-shadow: 0 0 0 3px rgba(243, 205, 0, 0.18);
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #111827;
      font-weight: 800;
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    #error {
      min-height: 20px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 600;
    }

    #reportFrame {
      display: none;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="lockScreen">
    <div class="lock-panel">
      <div class="lock-header">
        <div class="lock-icon">🔒</div>
        <h2>Secure Report Access</h2>
      </div>
      <p>Enter the report password to open the Qi Card Segmentation report.</p>
      <form id="passwordForm">
        <input id="passwordInput" type="password" placeholder="Enter password" autocomplete="off" />
        <button type="submit">Open Report</button>
        <div id="error" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <iframe id="reportFrame" title="Qi Card Segmentation Report"></iframe>

  <script>
    const REPORT_PASSWORD = 'SecurityLevel';
    const lockScreen = document.getElementById('lockScreen');
    const reportFrame = document.getElementById('reportFrame');
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('passwordInput');
    const error = document.getElementById('error');

    function unlock() {
      lockScreen.classList.add('hidden');
      reportFrame.style.display = 'block';
      reportFrame.src = 'qi_card_segmentation_v2%20(1).html';
      passwordInput.value = '';
      error.textContent = '';
    }

    if (sessionStorage.getItem('qiReportsUnlocked') === 'true') {
      unlock();
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const submitted = passwordInput.value.trim();

      if (submitted.toLowerCase() === REPORT_PASSWORD.toLowerCase()) {
        sessionStorage.setItem('qiReportsUnlocked', 'true');
        unlock();
      } else {
        error.textContent = 'Incorrect password. Please try again.';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
