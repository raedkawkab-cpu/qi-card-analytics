<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qi Card Analytics — Secure Dashboard Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1C2340 0%, #2D3E5F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #F3CD00, #E8C000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
        }
        
        h1 {
            font-size: 24px;
            color: #1C2340;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #1A1A1A;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E4E7EF;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.3s ease;
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: #F3CD00;
            box-shadow: 0 0 0 3px rgba(243, 205, 0, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1C2340, #2D3E5F);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(28, 35, 64, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-message {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 20px;
            animation: slideDown 0.3s ease;
        }
        
        .error-message.show {
            display: block;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .info-box {
            background: #F5F6FA;
            border: 1px solid #E4E7EF;
            border-radius: 8px;
            padding: 14px;
            font-size: 11px;
            color: #6B7280;
            line-height: 1.6;
            margin-top: 20px;
        }
        
        .info-box strong {
            color: #1A1A1A;
        }
        
        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #059669;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #E4E7EF;
        }
        
        .lock-icon {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">🔐</div>
            <h1>Qi Card Analytics</h1>
            <p class="subtitle">Secure Dashboard Access</p>
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Master Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    autocomplete="current-password"
                    required
                >
            </div>
            
            <button type="submit" class="btn-login">Access Dashboards</button>
        </form>
        
        <div class="info-box">
            <strong>📊 Available Reports:</strong><br>
            • Marketing & Revenue Strategy<br>
            • Client Segmentation Strategy<br>
            • Additional reports (coming soon)
        </div>
        
        <div class="security-badge">
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            All data is encrypted and access is logged
        </div>
    </div>

    <script>
        // SECURITY: Set your master password here
        // TODO: Change this to your desired password
        const MASTER_PASSWORD = "Qi@2026";
        
        // Session management (expires after 30 minutes of inactivity)
        const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutes in milliseconds
        const STORAGE_KEY = "qi-card-auth-session";
        
        let sessionTimer;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already authenticated
            if (isSessionValid()) {
                redirectToDashboard();
            }
            
            // Set up session timeout
            resetSessionTimer();
            
            // Listen for user activity
            document.addEventListener('mousemove', resetSessionTimer);
            document.addEventListener('keypress', resetSessionTimer);
            document.addEventListener('click', resetSessionTimer);
        });
        
        function handleLogin(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            // Clear previous error
            errorMsg.classList.remove('show');
            
            // Validate password
            if (password === MASTER_PASSWORD) {
                // Authentication successful
                createSession();
                errorMsg.classList.remove('show');
                
                // Show loading state
                event.target.textContent = 'Verifying...';
                event.target.disabled = true;
                
                // Redirect after brief delay
                setTimeout(() => {
                    redirectToDashboard();
                }, 500);
            } else {
                // Authentication failed
                errorMsg.textContent = '❌ Invalid password. Please try again.';
                errorMsg.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
        
        function createSession() {
            const sessionData = {
                authenticated: true,
                timestamp: new Date().getTime(),
                token: generateToken()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
        }
        
        function isSessionValid() {
            const session = localStorage.getItem(STORAGE_KEY);
            if (!session) return false;
            
            try {
                const data = JSON.parse(session);
                const now = new Date().getTime();
                const sessionAge = now - data.timestamp;
                
                // Check if session is still valid (within timeout period)
                if (sessionAge < SESSION_TIMEOUT) {
                    return true;
                } else {
                    // Session expired
                    localStorage.removeItem(STORAGE_KEY);
                    return false;
                }
            } catch (e) {
                return false;
            }
        }
        
        function resetSessionTimer() {
            clearTimeout(sessionTimer);
            sessionTimer = setTimeout(() => {
                // Session expired due to inactivity
                logout();
            }, SESSION_TIMEOUT);
        }
        
        function generateToken() {
            return Math.random().toString(36).substring(2, 15) + 
                   Math.random().toString(36).substring(2, 15);
        }
        
        function redirectToDashboard() {
            window.location.href = 'dashboard.html';
        }
        
        function logout() {
            localStorage.removeItem(STORAGE_KEY);
            window.location.reload();
        }
    </script>
</body>
</html>
